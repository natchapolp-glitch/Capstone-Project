<!doctype html><html lang="th"><meta charset="utf-8"><title>เทียบเฉลยสองรอบ</title><style>body{font:16px Tahoma;margin:30px;color:#183046}label{display:block;margin-top:14px}input,select,textarea,button{font:inherit;padding:10px}textarea{width:95%;min-height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f6;padding:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}button{background:#075e79;color:white;border:0;cursor:pointer}</style><h1>เทียบเฉลยที่กรอกสองรอบ</h1><p>อ่านภาพซ้ำเฉพาะจุดที่ต่าง แล้วแก้เฉลยสุดท้ายให้ตรงภาพ การตรวจคนเดียวสองรอบจะรายงานตามจริงว่าไม่มีผู้ตรวจอิสระคนที่สอง</p><a href="/review">กลับไปหน้าภาพและรายการ</a><label>รหัสภาพ <select id="doc"></select> <button id="load">เปิดผลสองรอบ</button></label><p id="message" role="status"></p><div class="pair"><pre id="first"></pre><pre id="second"></pre></div><label>ชื่อผู้ตรวจที่ตกลงเฉลย <input id="reviewer"></label><label>ข้อความสุดท้ายที่ตรวจจากภาพ<textarea id="transcript"></textarea></label><label>ข้อมูลสุดท้าย (ตรวจทุกฟิลด์จากภาพ) <textarea id="extraction"></textarea></label><label>กรอบในพิกัดภาพต้นฉบับ [x0,y0,x1,y1] <textarea id="boxes" style="min-height:50px"></textarea></label><label>รหัสกลุ่มธุรกรรมที่ตรวจว่าไม่ซ้ำ <input id="group" placeholder="เช่น TX_001"></label><label>ส่วนข้อมูล <select id="split"><option value="development">พัฒนาวิธี</option><option value="evaluation">ประเมินหลังตรึงวิธี</option><option value="challenge">ภาพต่างฉากใหม่</option></select></label><label>เหตุผลที่แก้ส่วนต่าง <textarea id="note" style="min-height:70px"></textarea></label><label><input type="checkbox" id="attest"> ฉันตรวจจากภาพและแก้ข้อขัดแย้งแล้ว ข้อมูลในขอบเขตนี้อ่านได้ครบ</label><p><button id="save">บันทึกเฉลยที่ตกลงแล้ว</button></p><script>
const $=x=>document.getElementById(x);let state,loadedDoc=null;async function api(path,data,retried=false){let r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Seminar-Token':state.token},body:JSON.stringify({...data,review_generation:state.review_generation||'initial'})}:{});let v=await r.json();if(r.status===403&&data&&!retried){state.token=(await (await fetch('/api/state')).json()).token;return api(path,data,true)}if(!r.ok)throw Error(v.error||r.status);return v}api('/api/state').then(v=>{state=v;for(let d of v.documents)$('doc').append(new Option(d.doc_id+' · '+d.store,d.doc_id));$('reviewer').value=v.reviewer_defaults.first_reviewer_name||''});$('load').onclick=async()=>{try{let r=await api('/api/adjudication?doc_id='+$('doc').value),a=r.entries.find(x=>x.slot==='first'),b=r.entries.find(x=>x.slot==='second');$('first').textContent='รอบแรก\n'+a.transcript+'\n'+JSON.stringify(a.extraction,null,2);$('second').textContent='รอบสอง\n'+b.transcript+'\n'+JSON.stringify(b.extraction,null,2);$('transcript').value=a.transcript;$('extraction').value=JSON.stringify(a.extraction,null,2);showContext(r.metadata);$('boxes').value=JSON.stringify(r.metadata.original_pixel_boxes);$('group').value=r.metadata.transaction_group_id||r.metadata.proposed_transaction_group_id||'';$('split').value=r.metadata.split==='unassigned'?(r.metadata.proposed_split||'development'):r.metadata.split;$('message').textContent='ใช้รอบแรกเป็นฐาน ตรวจส่วนต่างกับภาพแล้วแก้ด้านล่างก่อนบันทึก'}catch(e){$('message').textContent=e.message}};$('save').onclick=async()=>{try{let r=await api('/api/adjudicate',{doc_id:$('doc').value,adjudicator:$('reviewer').value,attestation:$('attest').checked,transcript:$('transcript').value,extraction:JSON.parse($('extraction').value),metadata:{original_pixel_boxes:JSON.parse($('boxes').value),transaction_group_id:$('group').value,split:$('split').value},unreadable_regions:[],new_scene_attestation:$('new-attest').checked,note:$('note').value});$('message').textContent='บันทึกเฉลยที่ตกลงแล้ว '+r.doc_id}catch(e){$('message').textContent=e.message}};
const preview=document.createElement('section');preview.innerHTML='<h2>ภาพในขอบเขตที่ตรวจ</h2><a id="full" target="_blank">เปิดภาพขนาดเต็ม</a><div style="max-height:800px;overflow:auto"><img id="image" style="max-width:100%" alt="ภาพที่ใช้ตรวจทั้งสองรอบ"></div><section id="new-scene" hidden><h2>เงื่อนไขภาพต่างฉากใหม่</h2><pre id="conditions"></pre><label><input type="checkbox" id="new-attest"> ยืนยันว่าเป็นภาพถ่ายใหม่ เงื่อนไขด้านบนถูกต้อง และไม่ได้สร้างจากการปรับภาพเดิม</label></section>';$('message').after(preview);$('save').disabled=true;$('boxes').readOnly=true;
function showContext(metadata){loadedDoc=metadata.doc_id;$('image').src='/api/image?view=reference&doc_id='+metadata.doc_id;$('full').href=$('image').src;$('new-scene').hidden=!metadata.challenge_candidate;$('conditions').textContent=JSON.stringify(metadata.capture_conditions||{},null,2);$('new-attest').checked=false;$('attest').checked=false;$('save').disabled=loadedDoc!==$('doc').value}
$('doc').onchange=()=>{loadedDoc=null;$('save').disabled=true;$('attest').checked=false;$('image').removeAttribute('src');$('message').textContent='กดเปิดผลสองรอบสำหรับภาพที่เลือกก่อนตรวจและบันทึก'};
const saveLoaded=$('save').onclick;$('save').onclick=()=>{if(loadedDoc!==$('doc').value){$('message').textContent='ต้องเปิดผลสองรอบของภาพที่เลือกก่อน';return}return saveLoaded()};
</script></html>
